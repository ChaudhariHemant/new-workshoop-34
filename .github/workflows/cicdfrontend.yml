name: CI/CD for Frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci;
          else
            npm install;
          fi
      - name: Run tests
        run: |
          if ls **/*.spec.ts **/*.test.ts 1> /dev/null 2>&1; then
            npm test;
          else
            echo 'No tests found, skipping test step.';
          fi
      - name: Build project
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Validate Vercel secrets
        run: |
          if [[ -z "${{ secrets.VERCEL_TOKEN }}" || -z "${{ secrets.VERCEL_PROJECT_ID }}" ]]; then
            echo '::error::Missing Vercel secrets';
            exit 1;
          fi
      - name: Upload files to Vercel
        run: |
          for file in $(git ls-files); do
            sha=$(sha1sum "$file" | awk '{ print $1 }');
            curl -X PUT "https://api.vercel.com/v2/files" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"file":"'$file'", "sha":"'$sha'"}';
          done
      - name: Deploy to Vercel
        run: |
          curl -X POST "https://api.vercel.com/v13/deployments?teamId=${{ secrets.VERCEL_ORG_ID }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"project":"${{ secrets.VERCEL_PROJECT_ID }}", "files": [$(git ls-files | jq -R . | jq -s .)]}'